# ============================================================================
# Castor — Automated Release Pipeline
# ============================================================================
# Triggered on version tags (e.g. `v1.0.0`).
#
# 1. Runs the Rust test gate and clippy check.
# 2. Creates the GitHub Release with generated release notes.
# 3. Publishes `mcp-castor` to npm with OIDC Trusted Publishing (--provenance).
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Verify · Rust stable · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build all targets
        shell: bash
        run: cargo build --all-targets

      - name: Run clippy (-D warnings, all features)
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify slim feature gate compiles (no-default + mcp)
        shell: bash
        run: cargo check --no-default-features --features mcp

      - name: Run tests (authoritative gate, all features)
        shell: bash
        run: cargo test --all-features

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Node shim
        shell: bash
        run: |
          node bin/castor.js --help
          node --test tests/castor_shim_test.mjs

  build-artifacts:
    name: Build Release · ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Tag Version
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Package Linux archive
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="castor-v${{ steps.meta.outputs.version }}-linux-x64.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C target/release castor
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Package Windows archive
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "castor-v${{ steps.meta.outputs.version }}-win32-x64.zip"
          Compress-Archive -Path "target/release/castor.exe" -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash -Path "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaPath = Join-Path (Resolve-Path "dist").Path "$archive.sha256"
          [System.IO.File]::WriteAllText($shaPath, "$hash  $archive`n")

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release & NPM Publish
    needs: [test, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Extract Tag Version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.tag }} exists, updating title and assets..."
            gh release edit "${{ steps.meta.outputs.tag }}" \
              --title "Castor ${{ steps.meta.outputs.version }}"
            gh release upload "${{ steps.meta.outputs.tag }}" release-assets/* --clobber
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              release-assets/* \
              --title "Castor ${{ steps.meta.outputs.version }}" \
              --generate-notes \
              --draft=false \
              --prerelease=false
          fi

      - name: Publish to NPM via OIDC Trusted Publishing
        run: |
          if npm view "mcp-castor@${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "mcp-castor@${{ steps.meta.outputs.version }} is already published on npm, ensuring latest dist-tag..."
            npm dist-tag add "mcp-castor@${{ steps.meta.outputs.version }}" latest || true
          else
            npm publish --access public --provenance --tag release
            npm dist-tag add "mcp-castor@${{ steps.meta.outputs.version }}" latest
          fi

      - name: Notify usecastor.github.io of new release (optional)
        env:
          WEB_DISPATCH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$WEB_DISPATCH_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN not set; skipping website dispatch."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEB_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/usecastor/usecastor.github.io/dispatches \
            -d "{\"event_type\":\"castor-release\",\"client_payload\":{\"tag\":\"$TAG\",\"version\":\"$VERSION\"}}"
